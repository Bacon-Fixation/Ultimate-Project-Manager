name: Desktop multi-architecture builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            command: npm run desktop:build -- --platform win --arch x64
            artifact: upm-windows-x64
          - name: Windows ARM64
            os: windows-11-arm
            command: npm run desktop:build -- --platform win --arch arm64
            artifact: upm-windows-arm64
          - name: Linux x64
            os: ubuntu-24.04
            command: npm run desktop:build -- --platform linux --arch x64
            artifact: upm-linux-x64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            command: npm run desktop:build -- --platform linux --arch arm64
            artifact: upm-linux-arm64
          - name: macOS x64
            os: macos-15-intel
            command: npm run desktop:build -- --platform mac --arch x64
            artifact: upm-macos-x64
          - name: macOS ARM64
            os: macos-15
            command: npm run desktop:build -- --platform mac --arch arm64
            artifact: upm-macos-arm64
          - name: macOS Universal
            os: macos-15
            command: npm run desktop:build -- --platform mac --arch universal
            artifact: upm-macos-universal

    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Build desktop artifact
        run: ${{ matrix.command }}

      - name: Size report
        run: npm run desktop:size

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release-slim/*.exe
            release-slim/*.AppImage
            release-slim/*.tar.xz
            release-slim/*.dmg
            release-slim/*.zip
          if-no-files-found: error
          compression-level: 0
