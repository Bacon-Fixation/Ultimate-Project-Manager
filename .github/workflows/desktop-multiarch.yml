name: Desktop multi-architecture builds

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

# Default deny.
# Each job receives only the permissions it actually needs.
permissions: {}

concurrency:
  group: desktop-multiarch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            command: npm run desktop:build -- --platform win --arch x64
            artifact: upm-windows-x64

          - name: Windows ARM64
            os: windows-11-arm
            command: npm run desktop:build -- --platform win --arch arm64
            artifact: upm-windows-arm64

          - name: Linux x64
            os: ubuntu-24.04
            command: npm run desktop:build -- --platform linux --arch x64
            artifact: upm-linux-x64

          - name: Linux ARM64
            os: ubuntu-24.04-arm
            command: npm run desktop:build -- --platform linux --arch arm64
            artifact: upm-linux-arm64

          - name: macOS x64
            os: macos-15-intel
            command: npm run desktop:build -- --platform mac --arch x64
            artifact: upm-macos-x64

          - name: macOS ARM64
            os: macos-15
            command: npm run desktop:build -- --platform mac --arch arm64
            artifact: upm-macos-arm64

          - name: macOS Universal
            os: macos-15
            command: npm run desktop:build -- --platform mac --arch universal
            artifact: upm-macos-universal

    runs-on: ${{ matrix.os }}

    timeout-minutes: 60

    env:
      # Prevent Electron Builder from trying to locate signing
      # certificates unless signing is deliberately configured later.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build never needs to push to GitHub, so do not leave
          # GITHUB_TOKEN credentials in the local Git configuration.
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          check-latest: false

      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner OS:   $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"
          echo "Node:        $(node --version)"
          echo "npm:         $(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Build desktop artifact
        run: ${{ matrix.command }}

      - name: Size report
        run: npm run desktop:size

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            release-slim/*.exe
            release-slim/*.AppImage
            release-slim/*.tar.xz
            release-slim/*.dmg
            release-slim/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release

    # Manual workflow runs build artifacts but DO NOT publish a release.
    # Releases happen only from pushed v* tags.
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')

    needs:
      - build

    runs-on: ubuntu-24.04

    timeout-minutes: 20

    # This is the ONLY job receiving write access.
    permissions:
      contents: write

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: upm-*
          path: release-assets
          merge-multiple: true

      - name: Show release assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Release assets:"
          find release-assets -maxdepth 1 -type f -print

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail

          cd release-assets

          find . \
            -maxdepth 1 \
            -type f \
            ! -name "SHA256SUMS.txt" \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

          echo
          echo "SHA-256 checksums:"
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          # This is GitHub's temporary per-job token.
          # No PAT needs to be created or stored.
          GH_TOKEN: ${{ github.token }}

          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}

        run: |
          set -euo pipefail

          shopt -s nullglob

          assets=(release-assets/*)

          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          echo "Publishing release: ${RELEASE_TAG}"

          # Make reruns safe. If the release already exists, replace its
          # assets instead of failing the entire workflow.
          if gh release view "${RELEASE_TAG}" \
            --repo "${REPOSITORY}" \
            >/dev/null 2>&1; then

            echo "Release already exists. Updating assets."

            gh release upload "${RELEASE_TAG}" \
              "${assets[@]}" \
              --repo "${REPOSITORY}" \
              --clobber

          else

            echo "Creating new release."

            gh release create "${RELEASE_TAG}" \
              "${assets[@]}" \
              --repo "${REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "Ultimate Project Manager ${RELEASE_TAG}"
          fi
