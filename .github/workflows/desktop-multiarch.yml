name: Desktop multi-architecture builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Deny permissions unless a job explicitly needs them.
permissions: {}

concurrency:
  group: desktop-multiarch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}

    # Build jobs only need to read repository contents.
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            command: npm run desktop:build -- --platform win --arch x64
            artifact: upm-windows-x64

          - name: Windows ARM64
            os: windows-11-arm
            command: npm run desktop:build -- --platform win --arch arm64
            artifact: upm-windows-arm64

          - name: Linux x64
            os: ubuntu-24.04
            command: npm run desktop:build -- --platform linux --arch x64
            artifact: upm-linux-x64

          - name: Linux ARM64
            os: ubuntu-24.04-arm
            command: npm run desktop:build -- --platform linux --arch arm64
            artifact: upm-linux-arm64

          - name: macOS x64
            os: macos-15-intel
            command: npm run desktop:build -- --platform mac --arch x64
            artifact: upm-macos-x64

          - name: macOS ARM64
            os: macos-15
            command: npm run desktop:build -- --platform mac --arch arm64
            artifact: upm-macos-arm64

          - name: macOS Universal
            os: macos-15
            command: npm run desktop:build -- --platform mac --arch universal
            artifact: upm-macos-universal

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    env:
      # Do not auto-discover signing certificates until signing is configured.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          # Packaging never pushes back to the repository.
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          check-latest: false

      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner OS:   $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"
          echo "Node:        $(node --version)"
          echo "npm:         $(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Build desktop artifact
        # scripts/electron-build.js always passes --publish never to
        # electron-builder. This is important on v26 because tagged CI runs
        # otherwise implicitly enter electron-builder's GitHub publish path.
        run: ${{ matrix.command }}

      - name: Size report
        run: npm run desktop:size

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            release-slim/*.exe
            release-slim/*.AppImage
            release-slim/*.tar.xz
            release-slim/*.dmg
            release-slim/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release

    # Manual runs build downloadable Actions artifacts but do not publish a
    # public GitHub Release. Only a pushed v* tag reaches this job.
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')

    needs:
      - build

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # The release job is the only job that can write repository contents.
    permissions:
      contents: write

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: upm-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          count="$(find release-assets -maxdepth 1 -type f | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "::error::No release assets were downloaded."
            exit 1
          fi
          echo "Release assets ($count):"
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . \
            -maxdepth 1 \
            -type f \
            ! -name "SHA256SUMS.txt" \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          # GitHub creates this short-lived token for this job. No PAT is
          # stored in the repository or workflow.
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)

          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets are available to publish."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; replacing matching assets."
            gh release upload "$RELEASE_TAG" \
              "${assets[@]}" \
              --repo "$REPOSITORY" \
              --clobber
          else
            echo "Creating release $RELEASE_TAG."
            gh release create "$RELEASE_TAG" \
              "${assets[@]}" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Ultimate Project Manager $RELEASE_TAG"
          fi
